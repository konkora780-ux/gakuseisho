<style>
:root{
  --bg:#eef1f8; --ink:#1c2333; --sub:#5b6377; --line:#dde2ef;
  --accent:#1e3a8a; --accent2:#173169; --gold:#c9a24b; --card:#fff;
  --danger:#c0392b; --ok:#1f8a4c; --warn:#b8860b;
  --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;line-height:1.6;padding-bottom:40px}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 60px}
.topbar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:18px 16px;text-align:center;font-weight:900;font-size:20px;letter-spacing:.05em;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.topbar small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:2px}
h2{font-size:17px;margin:0 0 12px}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 10px rgba(20,30,60,.08);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:5px}
.field input[type=text],.field input[type=password],.field input[type=date],.field select{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcff;font-family:inherit}
.field input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.photo-row{display:flex;align-items:center;gap:14px}
.photo-preview{width:84px;height:108px;border-radius:10px;background:#e6e9f2 center/cover no-repeat;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:11px;text-align:center}
.btn{appearance:none;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:100%}
.btn-primary:disabled{opacity:.55}
.btn-line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn-ok{background:var(--ok);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-gray{background:#eef0f5;color:var(--ink)}
.btn-block{width:100%;margin-top:10px}
.err{background:#fdecea;color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;font-weight:700}
.note{background:#fff7e6;border:1px solid #f1dfa8;border-radius:12px;padding:14px;font-size:14px;color:#6b5416}
.center{text-align:center}
.muted{color:var(--sub);font-size:13px}

/* 学生証カード */
.idcard{border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(20,30,60,.22);background:#fff;position:relative;border:1px solid #e2e6f0}
.idcard::after{content:'';position:absolute;top:-60%;left:-70%;width:35%;height:220%;
  background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,0) 35%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 65%,transparent 100%);
  transform:rotate(8deg);animation:idshine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes idshine{0%{left:-70%}45%{left:130%}100%{left:130%}}
.idcard .livebar{text-align:center;font-size:11px;color:var(--sub);letter-spacing:.04em;padding:0 16px 14px;position:relative}
.idcard .livebar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;animation:idpulse 1.6s ease-in-out infinite;vertical-align:1px}
.idcard .livebar span.t{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent)}
@keyframes idpulse{0%,100%{opacity:1}50%{opacity:.25}}
.idcard .band{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.idcard .band .school{font-weight:900;font-size:15px}
.idcard .band .tag{font-size:11px;letter-spacing:.15em;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:20px}
.idcard .crestwrap{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.idcard .crest{width:32px;height:32px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.15)}
.idcard .crest-empty{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.idcard .titlewrap{flex:1;min-width:0}
.idcard .doctitle{font-weight:900;font-size:16px;letter-spacing:.12em}
.idcard .noband{font-size:12px;font-weight:800;letter-spacing:.03em;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:20px;white-space:nowrap;flex:none}
.idcard .certify{font-size:11px;color:var(--sub);text-align:center;padding:9px 14px;border-bottom:1px dashed var(--line)}
.idcard .body{display:flex;gap:16px;padding:14px 16px}
.idcard .photo{width:132px;height:170px;border-radius:10px;object-fit:cover;background:#eceff5;border:2px solid var(--gold);flex:none}
.idcard .info{flex:1;min-width:0}
.idcard .name{font-size:22px;font-weight:900;line-height:1.3;word-break:break-word}
.idcard .grade{font-size:14px;color:var(--sub);margin-top:2px}
.idcard .fields{flex:1;min-width:0;display:grid;grid-template-columns:76px 1fr;row-gap:7px;column-gap:8px;font-size:13px;margin:0;align-content:start}
.idcard .fields dt{color:var(--sub);font-weight:700}
.idcard .fields dd{margin:0;font-weight:800;word-break:break-word;color:var(--ink)}
.idcard .datesrow{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:9px 16px;border-top:1px dashed var(--line)}
.idcard .issuer{border-top:6px solid #f2f4f9;background:#fafbfd;padding:11px 16px 14px;font-size:11.5px;color:var(--sub)}
.idcard .issuer-title{font-weight:800;color:var(--ink);margin-bottom:5px;font-size:11.5px}
.idcard .issuer .row{display:flex;gap:8px;margin-top:3px;align-items:center}
.idcard .issuer .row>span:first-child{flex:none;width:46px;color:var(--sub)}
.idcard .issuer .row>span:last-child{flex:1;color:var(--ink);font-weight:700}
.idcard .issuer .row.principal .pname{position:relative;display:inline-flex;align-items:center;gap:8px}
.idcard .foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 16px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);margin:0 16px}
.idcard .no{font-weight:800;color:var(--ink);letter-spacing:.04em}

.status-pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.pill-pending{background:#fff3d6;color:#8a6300}
.pill-rejected{background:#fdecea;color:var(--danger)}
.pill-revoked{background:#eceef3;color:var(--sub)}

.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--sub)}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.list-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.list-item img{width:48px;height:62px;object-fit:cover;border-radius:8px;background:#eceff5;flex:none}
.list-item .meta{flex:1;min-width:0}
.list-item .meta .n{font-weight:800;font-size:15px}
.list-item .meta .s{font-size:12px;color:var(--sub)}
.list-item .actions{display:flex;flex-direction:column;gap:6px}
.badge{background:var(--danger);color:#fff;font-size:11px;border-radius:20px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.footer-link{display:block;text-align:center;margin-top:22px;font-size:12px;color:var(--sub);text-decoration:none}
#qrcanvas{display:flex;justify-content:center;margin:12px auto}
.url-box{font-size:12px;word-break:break-all;background:#f4f6fb;border-radius:8px;padding:8px 10px;color:var(--sub);margin-top:8px}
.passbox{margin-top:16px;text-align:center;background:#fff7e6;border:1.5px dashed #e3c274;border-radius:12px;padding:12px}
.classrow{display:flex;gap:10px}
.classrow div{flex:1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.classrow input{width:52px;padding:8px 6px;text-align:center;font-size:14px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit}
.filterbar{display:flex;gap:8px;margin-bottom:12px}
.filterbar select{flex:1;padding:9px 8px;font-size:13px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcff;font-family:inherit;color:var(--ink)}
.hshint{margin-top:14px;background:#eef4ff;border:1px solid #cfe0fb;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#2c4a7c;line-height:1.6}
.hshint summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between}
.hshint summary::-webkit-details-marker{display:none}
.hshint summary::after{content:'▸';font-size:11px;margin-left:8px}
.hshint[open] summary::after{content:'▾'}
.hshint-body{margin-top:10px}
.reccode{margin-top:10px;background:#fff;border:1.5px dashed #9db8e8;border-radius:10px;padding:10px;text-align:center}
.reccode-label{font-size:11px;color:#5b76a8}
.reccode-value{font-size:19px;font-weight:900;letter-spacing:.08em;color:var(--accent);margin-top:3px}
.promote-box{margin-top:22px;padding-top:18px;border-top:2px dashed var(--line)}
.promote-title{font-weight:800;font-size:14px;margin-bottom:6px}
.passbox-label{font-size:12px;color:#8a6300;font-weight:700}
.passbox-value{font-size:22px;font-weight:900;letter-spacing:.08em;color:#6b5416;margin-top:2px;word-break:break-all}
</style>

<script>

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdseHN6YndzdmVtYnl5Z29jZWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDA5MzEsImV4cCI6MjA5NzE3NjkzMX0.Me73xDBFtOsNZ6ZRZZH8TNeXfwpiYvPBlplh4kRPsds";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
function fmtDateJp(input){ if(!input) return ''; const d = new Date(input); if(isNaN(d)) return ''; return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function schoolYearEndJp(issuedIso){
  const d = issuedIso ? new Date(issuedIso) : new Date();
  const y = d.getMonth() >= 3 ? d.getFullYear()+1 : d.getFullYear();
  return `${y}年3月31日`;
}
function schoolYearStartJp(issuedIso){
  const d = issuedIso ? new Date(issuedIso) : new Date();
  const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1;
  return `${y}年4月1日`;
}

let DEVICE_ID = localStorage.getItem('gks_device_id');
if(!DEVICE_ID){ DEVICE_ID = crypto.randomUUID(); localStorage.setItem('gks_device_id', DEVICE_ID); }

const state = {
  school: { name:'学生証発行校', address:'', phone:'', crest:null, principal:'', classes:[8,8,8] },
  myStatus: undefined, // undefined=未取得 / null=未申請 / object
  form: { name:'', grade:'', className:'', attendanceNo:'', department:'', birthdate:'', photo:'', passcode:'' },
  submitting: false,
  err: '',
  showRestore: false,
  restoreCode: '',
  restoreErr: '',
  restoreBusy: false,
  admin: {
    pass: sessionStorage.getItem('gks_admin_pass') || '',
    list: null,
    settingsForm: null,
    tab: 'pending',
    filterGrade: '',
    filterClass: '',
    err: '',
    busy: false
  }
};

function app(){ return document.getElementById('app'); }
function isAdminRoute(){ return location.hash.startsWith('#admin'); }
function schoolFromInfo(data){
  return {
    name: data.name, address: data.address||'', phone: data.phone||'', crest: data.crest||null, principal: data.principal||'',
    classes: [data.classes_grade1||8, data.classes_grade2||8, data.classes_grade3||8]
  };
}

async function boot(){
  document.getElementById('topbar').innerHTML = isAdminRoute()
    ? '学生証<small>先生用 管理画面</small>'
    : '学生証<small>デジタル学生証アプリ</small>';
  try{
    const { data } = await sb.rpc('gakuseisho_school_info');
    if(data) state.school = schoolFromInfo(data);
  }catch(e){}
  if(isAdminRoute()) await bootAdmin(); else await bootStudent();
}

/* ========== 生徒側 ========== */

async function bootStudent(){
  render();
  try{
    const { data, error } = await sb.rpc('gakuseisho_my_status', { p_device_id: DEVICE_ID });
    if(error) throw error;
    state.myStatus = data;
  }catch(e){
    state.bootErr = (e && e.message) ? e.message : '通信に失敗しました。電波の良い場所でもう一度開いてください。';
  }
  render();
}

function onPhotoInput(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 300, maxH = 400;
      const scale = Math.min(maxW/img.width, maxH/img.height, 1);
      const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      state.form.photo = c.toDataURL('image/jpeg', 0.85);
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function onFormInput(key, val){ state.form[key] = val; }
function onGradeSelect(val){ state.form.grade = val; state.form.className = ''; render(); }
function classCountForGrade(gradeText){
  const idx = {'1年':0,'2年':1,'3年':2}[gradeText];
  return idx===undefined ? 0 : (state.school.classes[idx] || 8);
}
function classSelectOptions(f){
  const n = classCountForGrade(f.grade);
  if(!n) return '<option value="">先に学年を選んでください</option>';
  let opts = '<option value="">選択してください</option>';
  for(let i=1;i<=n;i++){
    const v = `${i}組`;
    opts += `<option value="${esc(v)}" ${f.className===v?'selected':''}>${esc(v)}</option>`;
  }
  return opts;
}

async function submitApply(){
  const f = state.form;
  if(!f.name || !f.name.trim()){ state.err = '名前を入力してください。'; render(); return; }
  if(!f.passcode || !f.passcode.trim()){ state.err = '先生から聞いた合言葉を入力してください。'; render(); return; }
  state.submitting = true; state.err=''; render();
  try{
    const { error } = await sb.rpc('gakuseisho_apply', {
      p_device_id: DEVICE_ID, p_name: f.name.trim(), p_grade: f.grade.trim(),
      p_class: f.className.trim(), p_attendance_no: f.attendanceNo.trim(),
      p_department: f.department.trim(), p_birthdate: f.birthdate || null,
      p_photo: f.photo || null, p_passcode: f.passcode.trim()
    });
    if(error) throw error;
    const { data } = await sb.rpc('gakuseisho_my_status', { p_device_id: DEVICE_ID });
    state.myStatus = data;
  }catch(e){
    state.err = (e && e.message) ? e.message : '申請に失敗しました。';
  }
  state.submitting = false;
  render();
}

function retryApply(){ state.myStatus = null; state.err=''; render(); }

function toggleRestore(){ state.showRestore = !state.showRestore; state.restoreErr=''; render(); }
function onRestoreInput(val){ state.restoreCode = val; }
async function submitRestore(){
  const code = (state.restoreCode||'').trim();
  if(!code){ state.restoreErr = 'コードを入力してください。'; render(); return; }
  state.restoreBusy = true; state.restoreErr=''; render();
  try{
    const { data, error } = await sb.rpc('gakuseisho_restore', { p_recovery_code: code });
    if(error) throw error;
    DEVICE_ID = data.device_id;
    localStorage.setItem('gks_device_id', DEVICE_ID);
    state.showRestore = false; state.restoreCode = ''; state.restoreBusy = false;
    await bootStudent();
    return;
  }catch(e){
    state.restoreErr = (e && e.message) ? e.message : '復元に失敗しました。';
  }
  state.restoreBusy = false;
  render();
}

    <p class="muted">${esc(state.school.name)} の学生証を申請します。先生に教えてもらった合言葉が必要です。</p>

    <div class="field">

    </div>

    </div>

      </select>
    </div>
    <div class="field">

      <select onchange="onFormInput('className',this.value)">
        ${classSelectOptions(f)}
      </select>
    </div>
    <div class="field">
      <label>出席番号（任意）</label>
      <input type="text" value="${esc(f.attendanceNo)}" oninput="onFormInput('attendanceNo',this.value)" placeholder="例）15">
    </div>
    <div class="field">
      <label>生年月日（任意）</label>
      <input type="date" value="${esc(f.birthdate)}" oninput="onFormInput('birthdate',this.value)">
    </div>
    <div class="field">
      <label>写真（任意）</label>
      <div class="photo-row">
        <div class="photo-preview" style="${f.photo?`background-image:url('${f.photo}')`:''}">${f.photo?'':'写真'}</div>
        <input type="file" accept="image/*" capture="user" onchange="onPhotoInput(event)">
      </div>
      <div class="hint">なくても申請できます。あとから先生に相談してください。</div>
    </div>
    <div class="field">
      <label>合言葉</label>
      <input type="password" value="${esc(f.passcode)}" oninput="onFormInput('passcode',this.value)" placeholder="先生から聞いた合言葉">
    </div>
    <button class="btn btn-primary" ${state.submitting?'disabled':''} onclick="submitApply()">${state.submitting?'送信中…':'申請する'}</button>
  </div>
  <div class="card">
    <button class="btn btn-line btn-block" onclick="toggleRestore()">${state.showRestore?'閉じる':'別の端末の学生証をこの端末に復元する'}</button>
    ${state.showRestore ? `
      <div class="field" style="margin-top:14px">
        <label>引き継ぎコード</label>
        <input type="text" value="${esc(state.restoreCode)}" oninput="onRestoreInput(this.value)" placeholder="例）K7N2-QX9F" style="text-transform:uppercase">
        <div class="hint">申請したときに表示された8文字のコードです。</div>
      </div>
      ${state.restoreErr ? `<div class="err">${esc(state.restoreErr)}</div>` : ''}
      <button class="btn btn-primary btn-block" ${state.restoreBusy?'disabled':''} onclick="submitRestore()">${state.restoreBusy?'確認中…':'復元する'}</button>
    ` : ''}
  </div>`;
}

function homeScreenHint(code){
  return `<details class="hshint">

    <div class="hshint-body">
      この画面を閉じても大丈夫です。<b>同じスマホ・同じブラウザ</b>でこのページをもう一度開けば、いつでもここに戻ってきます。「ホーム画面に追加」する場合は、追加したあとのアイコンから今すぐこのページを開き直してください。

let _clockTimer = null;
function stopLiveClock(){ if(_clockTimer){ clearInterval(_clockTimer); _clockTimer = null; } }
function startLiveClock(){
  stopLiveClock();
  const tick = () => {
    const el = document.getElementById('livetime');
    if(!el){ stopLiveClock(); return; }
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    el.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  };
  tick();
  _clockTimer = setInterval(tick, 1000);
}

function render(){
  if(isAdminRoute()){ renderAdmin(); return; }
  let html = '';
  let showFooterLink = true;
  if(state.myStatus === undefined){
    html = state.bootErr
      ? `<div class="card center"><div class="err">${esc(state.bootErr)}</div><button class="btn btn-line btn-block" onclick="bootStudent()">もう一度試す</button></div>`
      : `<div class="card center muted">読み込み中…</div>`;
  } else if(state.myStatus === null){
    html = viewApplyForm();
  } else {
    const st = state.myStatus.status;
    if(st === 'pending') html = viewPendingCard();
    else if(st === 'approved'){ html = viewIdCard(); showFooterLink = false; }
    else if(st === 'rejected') html = viewRejected();
    else if(st === 'revoked') html = viewRevoked();
  }
  if(showFooterLink) html += `<a class="footer-link" href="#admin">先生用 管理画面はこちら</a>`;
  app().innerHTML = html;
  if(state.myStatus && state.myStatus.status === 'approved') startLiveClock(); else stopLiveClock();
}

/* ========== 先生用 管理画面 ========== */

async function bootAdmin(){
  if(!state.admin.pass){ render(); return; }
  await loadAdminList();
}

function adminLoginInput(val){ state.admin._pass = val; }

async function adminLogin(){
  const pass = state.admin._pass || '';
  state.admin.err=''; state.admin.busy=true; render();
  try{
    const { error } = await sb.rpc('gakuseisho_admin_list', { p_admin_pass: pass });
    if(error) throw error;
    state.admin.pass = pass;
    sessionStorage.setItem('gks_admin_pass', pass);
    await loadAdminList();
    return;
  }catch(e){
    state.admin.err = 'パスワードが違います。';
  }
  state.admin.busy=false;
  render();
}

function adminLogout(){
  state.admin.pass=''; state.admin.list=null; state.admin.settingsForm=null;
  sessionStorage.removeItem('gks_admin_pass');
  render();
}

async function loadAdminList(){
  state.admin.busy = true; render();
  try{
    const { data, error } = await sb.rpc('gakuseisho_admin_list', { p_admin_pass: state.admin.pass });
    if(error) throw error;
    state.admin.list = data || [];
    state.admin.err='';
  }catch(e){
    state.admin.err = 'パスワードが違います。もう一度ログインしてください。';
    adminLogout();
    return;
  }
  state.admin.busy = false;
  render();
}

async function adminApprove(id){
  state.admin.busy = true; render();
  try{
    const { error } = await sb.rpc('gakuseisho_admin_approve', { p_admin_pass: state.admin.pass, p_id: id });
    if(error) throw error;
  }catch(e){ alert('承認に失敗しました: ' + (e.message||e)); }
  await loadAdminList();
}

async function adminReject(id){
  if(!confirm('この申請を却下しますか？')) return;
  state.admin.busy = true; render();
  try{
    const { error } = await sb.rpc('gakuseisho_admin_reject', { p_admin_pass: state.admin.pass, p_id: id });
    if(error) throw error;
  }catch(e){ alert('却下に失敗しました: ' + (e.message||e)); }
  await loadAdminList();
}

async function adminRevoke(id){
  if(!confirm('この学生証を無効にしますか？（卒業・転校など）')) return;
  state.admin.busy = true; render();
  try{
    const { error } = await sb.rpc('gakuseisho_admin_revoke', { p_admin_pass: state.admin.pass, p_id: id });
    if(error) throw error;
  }catch(e){ alert('操作に失敗しました: ' + (e.message||e)); }
  await loadAdminList();
}

async function adminPromote(){
  if(!confirm('進級処理を行います。\n・1年→2年、2年→3年に変更されます\n・クラス替えに備えて、進級した生徒の「組」はいったん未設定に戻ります（承認済み一覧の「組を編集」から設定し直してください）\n・現在の3年は「無効」になります（卒業扱い）\nこの操作は元に戻せません。よろしいですか？')) return;
  state.admin.busy = true; render();
  try{
    const { data, error } = await sb.rpc('gakuseisho_admin_promote', { p_admin_pass: state.admin.pass });
    if(error) throw error;
    alert(`進級処理が完了しました。\n卒業（無効化）: ${data.graduated}人\n3年に進級: ${data.promoted_to_3}人\n2年に進級: ${data.promoted_to_2}人\n\n進級した生徒の組は未設定になっています。承認済み一覧から組を設定し直してください。`);
  }catch(e){ alert('進級処理に失敗しました: ' + (e.message||e)); }
  await loadAdminList();
}

function adminSetTab(tab){ state.admin.tab = tab; render(); if(tab==='settings'||tab==='qr') loadSettingsIfNeeded(); if(tab==='qr') drawQrSoon(); }

async function loadSettingsIfNeeded(){
  if(state.admin.settingsForm) return;
  try{
    const { data, error } = await sb.rpc('gakuseisho_admin_get_settings', { p_admin_pass: state.admin.pass });
    if(error) throw error;
    state.admin.settingsForm = {
      school_name: data.school_name, school_address: data.school_address || '', school_phone: data.school_phone || '',
      school_crest: data.school_crest || '', principal_name: data.principal_name || '',
      apply_pass: data.apply_pass, new_admin_pass: '',
      classes_grade1: data.classes_grade1 || 8, classes_grade2: data.classes_grade2 || 8, classes_grade3: data.classes_grade3 || 8
    };
  }catch(e){}
  render();
  if(state.admin.tab === 'qr') drawQrSoon();
}

function onSettingsInput(key, val){ state.admin.settingsForm[key] = val; }

function onCrestInput(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxSize = 200;
      const scale = Math.min(maxSize/img.width, maxSize/img.height, 1);
      const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      state.admin.settingsForm.school_crest = c.toDataURL('image/png');
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

async function saveSettings(){
  const f = state.admin.settingsForm;
  state.admin.busy = true; render();
  try{
    const { error } = await sb.rpc('gakuseisho_admin_update_settings', {
      p_admin_pass: state.admin.pass, p_school_name: f.school_name, p_school_address: f.school_address,
      p_school_phone: f.school_phone, p_school_crest: f.school_crest, p_principal_name: f.principal_name,
      p_apply_pass: f.apply_pass, p_new_admin_pass: f.new_admin_pass,
      p_classes_grade1: Number(f.classes_grade1) || 8, p_classes_grade2: Number(f.classes_grade2) || 8,
      p_classes_grade3: Number(f.classes_grade3) || 8
    });
    if(error) throw error;
    if(f.new_admin_pass && f.new_admin_pass.trim()){
      state.admin.pass = f.new_admin_pass.trim();
      sessionStorage.setItem('gks_admin_pass', state.admin.pass);
    }
    f.new_admin_pass = '';
    const { data } = await sb.rpc('gakuseisho_school_info');
    if(data) state.school = schoolFromInfo(data);
    alert('設定を保存しました。');
  }catch(e){ alert('保存に失敗しました: ' + (e.message||e)); }
  state.admin.busy = false;
  render();
}

function drawQrSoon(){
  setTimeout(() => {
    const c = document.getElementById('qrcanvas');
    if(c && window.QRCode){
      c.innerHTML = '';
      new QRCode(c, { text: location.origin + location.pathname, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
    }
  }, 30);
}

function studentCardMini(s){
  const photo = s.photo ? `<img src="${s.photo}">` : `<img style="background:#eceff5">`;
  const clsText = s.class_name || '組未設定';
  const cls = [s.grade, clsText].filter(Boolean).join('');
  const no = s.attendance_no ? `${s.attendance_no}番` : '';
  return `${photo}<div class="meta"><div class="n">${esc(s.name)}</div><div class="s">${esc([cls,no].filter(Boolean).join(' '))}・${fmtDate(s.created_at)}申請</div></div>`;
}

async function adminEditClass(id, currentClass){
  const v = prompt('組を入力してください（例：3組。空欄で未設定に戻せます）', currentClass || '');
  if(v === null) return;
  state.admin.busy = true; render();
  try{
    const { error } = await sb.rpc('gakuseisho_admin_set_class', { p_admin_pass: state.admin.pass, p_id: id, p_class_name: v });
    if(error) throw error;
  }catch(e){ alert('変更に失敗しました: ' + (e.message||e)); }
  await loadAdminList();
}

function adminSetFilter(key, val){ state.admin[key] = val; if(key==='filterGrade') state.admin.filterClass=''; render(); }
function filterListByClass(arr){
  return arr.filter(s => (!state.admin.filterGrade || s.grade===state.admin.filterGrade) && (!state.admin.filterClass || s.class_name===state.admin.filterClass));
}
function classFilterOptions(){
  const g = state.admin.filterGrade;
  const n = g ? classCountForGrade(g) : Math.max(...state.school.classes);
  let opts = '<option value="">すべて</option>';
  for(let i=1;i<=n;i++){ const v = `${i}組`; opts += `<option value="${esc(v)}" ${state.admin.filterClass===v?'selected':''}>${esc(v)}</option>`; }
  return opts;
}
function classFilterBar(){
  return `
  <div class="filterbar">
    <select onchange="adminSetFilter('filterGrade',this.value)">
      <option value="">学年：すべて</option>
      <option value="1年" ${state.admin.filterGrade==='1年'?'selected':''}>1年</option>
      <option value="2年" ${state.admin.filterGrade==='2年'?'selected':''}>2年</option>
      <option value="3年" ${state.admin.filterGrade==='3年'?'selected':''}>3年</option>
    </select>
    <select onchange="adminSetFilter('filterClass',this.value)">${classFilterOptions()}</select>
  </div>`;
}

    body = classFilterBar() + (pending.length ? pending.map(s => `
      <div class="list-item">

    <div class="muted">${esc(state.school.name)}</div>
    <button class="btn btn-sm btn-gray" onclick="adminLogout()">ログアウト</button>
  </div>
  <div class="tabs">
    <button class="${state.admin.tab==='pending'?'on':''}" onclick="adminSetTab('pending')">承認待ち${pending.length?`<span class="badge">${pending.length}</span>`:''}</button>
    <button class="${state.admin.tab==='approved'?'on':''}" onclick="adminSetTab('approved')">承認済み</button>
  </div>
  <div class="tabs">
    <button class="${state.admin.tab==='others'?'on':''}" onclick="adminSetTab('others')">却下・無効</button>
    <button class="${state.admin.tab==='qr'?'on':''}" onclick="adminSetTab('qr')">配布QR</button>
    <button class="${state.admin.tab==='settings'?'on':''}" onclick="adminSetTab('settings')">設定</button>
  </div>
  <div class="card">${body}</div>
  <a class="footer-link" href="#">生徒用の画面にもどる</a>`;
}

function renderAdmin(){
  let html;
  if(!state.admin.pass || !state.admin.list){
    html = state.admin.pass ? `<div class="card center muted">読み込み中…</div>` : viewAdminLogin();
  } else {
    html = viewAdminDash();
  }
  app().innerHTML = html;
}

window.addEventListener('hashchange', boot);
boot();
</script>
</body>
</html>
